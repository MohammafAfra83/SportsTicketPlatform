name: Phase 2 CI - Dockerized Database & Query Verification

on:
  push:
    branches: [phase2-database-implementation, main]
  pull_request:
    branches: [phase2-database-implementation, main]

jobs:
  verify-docker-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Make init.sh executable
        run: chmod +x database/init.sh

      - name: 1. Start Database via Docker Compose
        run: docker compose up -d

      - name: 2. Wait for Database Initialization to Complete
        run: |
          echo "Waiting for Postgres container to run initialization scripts..."
          sleep 10

      - name: 3. Check Container Logs for Errors
        run: docker logs sports_ticket_postgres

      - name: 4. Verify Final Database Integrity
        run: |
          echo "Checking table structure and record counts inside Docker..."
          docker exec sports_ticket_postgres psql -U postgres -d sports_ticket_db -c "\dt"
          docker exec sports_ticket_postgres psql -U postgres -d sports_ticket_db -c "SELECT COUNT(*) AS total_users FROM users;"
          docker exec sports_ticket_postgres psql -U postgres -d sports_ticket_db -c "SELECT COUNT(*) AS total_tickets FROM tickets;"

      - name: 5. Shutdown Containers
        if: always()
        run: docker compose down -v
