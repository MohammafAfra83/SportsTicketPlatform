name: Continuous Integration - Full Suite Test

on:
  push:
    branches: [phase2-database-implementation, main]
  pull_request:
    branches: [phase2-database-implementation, main]

jobs:
  verify-database-suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sports_ticket_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: 1. Test DDL Execution (schema.sql)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d sports_ticket_db -f database/scripts/schema.sql

      - name: 2. Test Seed Data Insertion (init.sql)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d sports_ticket_db -f database/scripts/init.sql

      - name: 3. Test Stored Procedures Creation (procedures.sql)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d sports_ticket_db -f database/scripts/procedures.sql

      - name: 4. Test Analytical Queries Execution (queries.sql)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d sports_ticket_db -f database/scripts/queries.sql
