version: "3.8"

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: sports_ticket_postgres
    restart: always
    environment:
      POSTGRES_DB: sports_ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: persianlord@0171
    ports:
      - "5433:5432"
    volumes:
      - ./database/scripts:/scripts
      - ./database/init.sh:/docker-entrypoint-initdb.d/01-init.sh
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Addition of Redis caching service for Phase 3
  redis:
    image: redis:alpine
    container_name: sports_ticket_redis
    restart: always
    ports:
      - "6379:6379"

  # Addition of FastAPI Backend Service
  api:
    build:
      context: ./backend # Specifying the path to the folder containing the Dockerfile
    container_name: sports_ticket_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy # Ensuring the backend service waits for the database to be healthy before starting
      redis:
        condition: service_started
    environment:
      # Environment variables for dynamic connection of the backend to the database and cache within the isolated Docker network
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=persianlord@0171
      - DB_NAME=sports_ticket_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  postgres_data:
    driver: local
